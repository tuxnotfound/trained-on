# Omakase for style, plus the limits from control-tower/RAILS.md.
# In a project that existed before 2026-10-01, old offenses live in .rubocop_todo.yml (see RAILS.md).
inherit_from: .rubocop_todo.yml
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  Exclude:
    - "scripts/**/*"   # the original go/no-go test, kept as run
    - "corpus/**/*"

# Size: a file you can read in one sitting, a method you can hold in your head.
Metrics/ClassLength:
  Enabled: true
  Max: 150
  Include: ["app/**/*.rb", "lib/**/*.rb"]

Metrics/ModuleLength:
  Enabled: true
  Max: 150
  Include: ["app/**/*.rb", "lib/**/*.rb"]

Metrics/MethodLength:
  Enabled: true
  Max: 20
  CountAsOne: [array, hash, heredoc, method_call]
  Include: ["app/**/*.rb", "lib/**/*.rb"]

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 10
  Include: ["app/**/*.rb", "lib/**/*.rb"]

# Errors: never swallow one silently.
Lint/SuppressedException:
  Enabled: true
  AllowComments: false

Lint/RescueException:
  Enabled: true
