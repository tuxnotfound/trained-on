# Kamal deploy for Trained On. NOT DEPLOYED YET: set the three environment
# variables below, provision one small server (the build plan says a Hetzner
# CX22, ~EUR 4-5/month), then `bin/kamal setup`. See README "Deploy".
#
#   TRAINED_ON_SERVER_IP       the server's public IP (required)
#   KAMAL_REGISTRY_PASSWORD    a GitHub token with write:packages, for ghcr.io (required)
#   TRAINED_ON_ADMIN_PASSWORD  the review admin password (required)
# Everything else has a default: host trainedon.me, image ghcr.io/tuxnotfound/trained-on.
service: trained-on
image: <%= ENV.fetch("TRAINED_ON_REGISTRY", "ghcr.io/tuxnotfound/trained-on") %>

servers:
  web:
    - <%= ENV.fetch("TRAINED_ON_SERVER_IP", "192.0.2.1") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("TRAINED_ON_HOST", "trainedon.me") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "tuxnotfound") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TRAINED_ON_ADMIN_PASSWORD
    - SMTP_PASSWORD
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
  clear:
    # Run Solid Queue (and so the nightly refresh) inside Puma: one process, one box.
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: "<%= ENV.fetch("TRAINED_ON_HOST", "trainedon.me") %>"
    TRAINED_ON_ADMIN_USER: "<%= ENV.fetch("TRAINED_ON_ADMIN_USER", "tux") %>"
    TRAINED_ON_REVIEWER: "<%= ENV.fetch("TRAINED_ON_REVIEWER", "") %>"
    TRAINED_ON_MAIL_FROM: "<%= ENV.fetch("TRAINED_ON_MAIL_FROM", "") %>"
    SMTP_ADDRESS: "<%= ENV.fetch("SMTP_ADDRESS", "") %>"
    SMTP_USERNAME: "<%= ENV.fetch("SMTP_USERNAME", "") %>"
    TRAINED_ON_ANTHROPIC_MODEL: "<%= ENV.fetch("TRAINED_ON_ANTHROPIC_MODEL", "") %>"
    TRAINED_ON_OPENAI_MODEL: "<%= ENV.fetch("TRAINED_ON_OPENAI_MODEL", "gpt-5.5") %>"
    TRAINED_ON_GEMINI_MODEL: "<%= ENV.fetch("TRAINED_ON_GEMINI_MODEL", "gemini-3.1-pro-preview") %>"

# The server is created with this Mac's tuxnotfound key.
ssh:
  keys: [ "~/.ssh/id_ed25519_tuxnotfound" ]

# SQLite databases, backups and the OTA corpus clone all live here.
volumes:
  - "trained_on_storage:/rails/storage"

asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  bootstrap: app exec "bin/rails trained_on:bootstrap"
  panel: app exec "bin/rails trained_on:panel"
  panel_check: app exec "bin/rails trained_on:panel_check"
  refresh: app exec "bin/rails runner NightlyRefreshJob.perform_now"
  backup: app exec "bin/rails trained_on:backup"

builder:
  arch: amd64
