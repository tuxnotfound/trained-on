# Kamal deploy for Trained On. NOT DEPLOYED YET. Target: tux-box, the one
# Hetzner server every project shares (CX33, x86, 2.28.203.124; decided
# 2026-09-28, see README "Deploy" for the runbook and the control tower's
# HOSTING.md). Set the environment variables below, then `bin/kamal setup`.
#
#   TRAINED_ON_SERVER_IP       the server's public IP (required)
#   KAMAL_REGISTRY_PASSWORD    a GitHub token with write:packages, for ghcr.io (required)
#   TRAINED_ON_ADMIN_PASSWORD  the review admin password (required)
# Everything else has a default: host trainedon.me, image ghcr.io/tuxnotfound/trained-on.
service: trained-on
image: <%= ENV.fetch("TRAINED_ON_IMAGE", "tuxnotfound/trained-on") %>

servers:
  web:
    - <%= ENV.fetch("TRAINED_ON_SERVER_IP", "192.0.2.1") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("TRAINED_ON_HOST", "trainedon.me") %>
  # Behind Cloudflare: pass its X-Forwarded-For through, or Rails sees the edge
  # as every client and the admin login's rate limit locks everyone out.
  forward_headers: true

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "tuxnotfound") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TRAINED_ON_ADMIN_PASSWORD
    - SMTP_PASSWORD
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    # Not secret, but read the same way (shell, else .env) so a deploy from a
    # fresh shell cannot blank them. It did once: backups stayed on the box and
    # the digest stopped.
    - R2_ENDPOINT
    - R2_BUCKET
    - SMTP_ADDRESS
    - SMTP_USERNAME
    - TRAINED_ON_REVIEWER
    - TRAINED_ON_MAIL_FROM
  clear:
    # Run Solid Queue (and so the nightly refresh) inside Puma: one process, one box.
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: "<%= ENV.fetch("TRAINED_ON_HOST", "trainedon.me") %>"
    TRAINED_ON_ADMIN_USER: "<%= ENV.fetch("TRAINED_ON_ADMIN_USER", "tux") %>"
    TRAINED_ON_ANTHROPIC_MODEL: "<%= ENV.fetch("TRAINED_ON_ANTHROPIC_MODEL", "") %>"
    TRAINED_ON_OPENAI_MODEL: "<%= ENV.fetch("TRAINED_ON_OPENAI_MODEL", "gpt-5.5") %>"
    TRAINED_ON_GEMINI_MODEL: "<%= ENV.fetch("TRAINED_ON_GEMINI_MODEL", "gemini-3.1-pro-preview") %>"

# The server is created with this Mac's tuxnotfound key.
ssh:
  keys: [ "~/.ssh/id_ed25519_tuxnotfound" ]

# SQLite databases, backups and the OTA corpus clone all live here.
volumes:
  - "trained_on_storage:/rails/storage"

asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  bootstrap: app exec "bin/rails trained_on:bootstrap"
  panel: app exec "bin/rails trained_on:panel"
  panel_check: app exec "bin/rails trained_on:panel_check"
  refresh: app exec "bin/rails runner NightlyRefreshJob.perform_now"
  backup: app exec "bin/rails trained_on:backup"

# Built on the box itself, natively: Kamal's local amd64 builder runs under
# QEMU on Apple Silicon and its compiles die at random (bootsnap's extconf
# took a trap signal on the first deploy).
builder:
  arch: amd64
  remote: ssh://root@<%= ENV.fetch("TRAINED_ON_SERVER_IP", "192.0.2.1") %>
