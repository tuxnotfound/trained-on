# Hand-chosen anchors: stable phrases that identify the segments (paragraph,
# bullet or table cell) of each document's training clause. Matching is
# case-insensitive after normalisation. A phrase must survive routine edits, so
# prefer the core construction ("use your inputs and outputs to train") over
# wording that vendors rephrase. Chosen 2026-09-25 from a survey of every
# segment the regex net matched across the full OTA history.
#
# Deliberately NOT anchored: indemnification, fine-tuning API, output
# limitations, "how we train" process descriptions, data-type lists. Those
# caused the locator churn found by the human read.

